name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all
      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply cargo fmt"
          branch: ${{ github.head_ref }}

  check:
    name: Check
    needs: fmt
    if: always() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf,thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  test:
    name: Test
    needs: fmt
    if: always() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run library tests on host
        run: |
          cargo test --workspace \
            --exclude duet3-firmware --exclude ebb42-firmware --exclude pico-firmware \
            --exclude actor-framework --exclude wasm-sim \
            --target x86_64-unknown-linux-gnu

  clippy:
    name: Clippy
    needs: fmt
    if: always() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf,thumbv6m-none-eabi
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  coverage:
    name: Coverage
    needs: fmt
    if: always() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Same host-testable crate set as the Test job. Threshold sits just
      # below the measured baseline (74.5% lines) so coverage can't regress.
      - name: Library coverage on host
        run: |
          cargo llvm-cov --workspace \
            --exclude duet3-firmware --exclude ebb42-firmware --exclude pico-firmware \
            --exclude actor-framework --exclude wasm-sim \
            --target x86_64-unknown-linux-gnu \
            --lcov --output-path lcov.info --fail-under-lines 74
      - name: Coverage summary
        if: always()
        run: cargo llvm-cov report --target x86_64-unknown-linux-gnu --summary-only
      - name: Upload lcov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: ignore
