name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all
      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: apply cargo fmt"
          branch: ${{ github.head_ref }}

  check:
    name: Check
    needs: fmt
    if: always() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf,thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  test:
    name: Test
    needs: fmt
    if: always() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run library tests on host
        run: |
          cargo test --workspace \
            --exclude duet3-firmware --exclude ebb42-firmware --exclude pico-firmware \
            --exclude actor-framework --exclude wasm-sim \
            --target x86_64-unknown-linux-gnu

  clippy:
    name: Clippy
    needs: fmt
    if: always() && !failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf,thumbv6m-none-eabi
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  coverage:
    name: Coverage
    needs: fmt
    if: always() && !failure()
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml says `stable`; this overrides it for the pin below.
      RUSTUP_TOOLCHAIN: 1.99.1
    permissions:
      contents: read
      # Upload to GitHub Code Quality's code coverage (actions/upload-code-coverage).
      code-quality: write
    steps:
      - uses: actions/checkout@v4
      # Pinned: the 74% floor was measured with rustc 1.99.1 + cargo-llvm-cov
      # 0.9.1. On stable 1.100.1 (2026-11) the run exits 1 right after
      # writing the report and prints no total (0.9.2 passes on 1.91), so
      # bump the toolchain only together with re-measuring the floor.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # Same host-testable crate set as the Test job. Threshold sits just
      # below the measured baseline (74.5% lines) so coverage can't regress.
      - name: Library coverage on host
        run: |
          cargo llvm-cov --workspace \
            --exclude duet3-firmware --exclude ebb42-firmware --exclude pico-firmware \
            --exclude actor-framework --exclude wasm-sim \
            --target x86_64-unknown-linux-gnu \
            --lcov --output-path lcov.info --fail-under-lines 74
      - name: Coverage summary
        if: always()
        run: cargo llvm-cov report --target x86_64-unknown-linux-gnu --summary-only
      - name: Cobertura report
        if: always()
        run: cargo llvm-cov report --target x86_64-unknown-linux-gnu --cobertura --output-path coverage.xml
      # Code Quality compares PR coverage with main, so this runs on both.
      # It needs Code Quality enabled on the repo (Settings > Security > Code
      # quality); until then the upload fails without failing the job.
      - name: Upload coverage to Code Quality
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Rust
          label: code-coverage/llvm-cov
      - name: Upload lcov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: ignore

  # flight/ is its own workspace (host only). It depends on
  # jvishnefske/middleware through `../../middleware`, so that is checked out
  # next to the repo at the commit flight/flake.lock pins.
  flight:
    name: Flight sim
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
    permissions:
      contents: read
      code-quality: write
    defaults:
      run:
        working-directory: flight
    steps:
      - uses: actions/checkout@v4
      - name: Check out middleware at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: jvishnefske/middleware
          ref: ac0b741017a4c875798f67cf0c533e6c713e62b2
          path: _middleware
      - name: Put middleware where ../../middleware resolves
        working-directory: .
        run: mv _middleware ../middleware
      # Same pins as the Coverage job.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: flight
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # No --all: that also formats path dependencies (../../middleware).
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests with coverage
        run: cargo llvm-cov --workspace --target x86_64-unknown-linux-gnu --cobertura --output-path coverage.xml
      - name: Coverage summary
        if: always()
        run: cargo llvm-cov report --target x86_64-unknown-linux-gnu --summary-only
      - name: Upload coverage to Code Quality
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/upload-code-coverage@v1
        with:
          file: flight/coverage.xml
          language: Rust
          label: code-coverage/flight
