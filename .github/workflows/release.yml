name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - board: duet3-mini5
            package: duet3-firmware
            target: thumbv7em-none-eabihf
            binary: duet3-firmware
            memory_x: memory.x

          - board: ebb42
            package: ebb42-firmware
            target: thumbv6m-none-eabi
            binary: ebb42-firmware
            memory_x: firmware-ebb42/memory.x

          - board: skr-pico
            package: pico-firmware
            target: thumbv6m-none-eabi
            binary: pico-firmware
            memory_x: firmware-pico/memory.x

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.board }}

      - name: Build release binary
        run: cargo build --release -p ${{ matrix.package }} --target ${{ matrix.target }}

      - name: Convert to bin format
        run: |
          cargo install cargo-binutils
          rustup component add llvm-tools
          rust-objcopy -O binary \
            target/${{ matrix.target }}/release/${{ matrix.binary }} \
            ${{ matrix.board }}.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}
          path: ${{ matrix.board }}.bin

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/duet3-mini5/duet3-mini5.bin
            artifacts/ebb42/ebb42.bin
            artifacts/skr-pico/skr-pico.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
