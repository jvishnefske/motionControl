[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
flight-core = { path = "crates/flight-core" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
mavlink = { version = "0.17", features = ["tokio-1", "common", "udp", "tcp"] }
# ~/src/middleware, relative to this workspace (../../middleware from ~/src/katas/flight).
middleware = { path = "../../middleware", default-features = false }
